# Publishes a release when a v* tag is pushed: binaries, archives, checksums,
# SBOMs, cosign signatures (keyless, through GitHub OIDC), the container image
# on ghcr.io, deb/rpm, and Homebrew/Scoop/winget manifests when their secrets
# are set. A tag with a suffix (v1.0.0-rc.1) is published as a prerelease.
name: release
on:
  push:
    tags: ["v*"]

# Third-party actions are pinned to commit SHAs (the tag is in the comment), and
# GoReleaser to an exact version: this job holds the signing identity the
# install scripts trust and the package-manager secrets. Update them together,
# re-resolving each SHA with git ls-remote.
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    # contents: the GitHub release; packages: the ghcr.io image; id-token: the
    # keyless cosign signatures. GoReleaser does all three in one run.
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7 (v7.1.0)
        with:
          go-version-file: go.mod
      - run: go test -short ./...
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0 (v0.24.0)
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4 (v4.4.0)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4 (v4.4.1)
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4 (v4.8.0)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7 (v7.3.0)
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_SSH_KEY: ${{ secrets.TAP_SSH_KEY }}
          SCOOP_SSH_KEY: ${{ secrets.SCOOP_SSH_KEY }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
