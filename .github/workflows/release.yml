# Publishes a release when a v* tag is pushed: binaries, archives, checksums,
# SBOMs, cosign signatures (keyless, through GitHub OIDC), the container image
# on ghcr.io, deb/rpm, and Homebrew/Scoop/winget manifests when their secrets
# are set. A tag with a suffix (v1.0.0-rc.1) is published as a prerelease.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -short ./...
      - uses: sigstore/cosign-installer@v4
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_SSH_KEY: ${{ secrets.TAP_SSH_KEY }}
          SCOOP_SSH_KEY: ${{ secrets.SCOOP_SSH_KEY }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
