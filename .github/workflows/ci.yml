name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: git --version
      - run: go vet ./...
      # -short trims the multi-clone simulator (S5); the full run is below.
      - run: go test -race -short ./...
      - name: Full simulator and scenarios
        if: runner.os == 'Linux'
        run: go test -count=1 ./internal/scenario/
      - name: Build ka
        run: go build ./cmd/ka
