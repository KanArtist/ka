name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7 (v7.1.0)
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: git --version
      - run: go vet ./...
      # -short trims the multi-clone simulator (S5); the full run is below.
      # The engine and scenario packages take over seven minutes each on the
      # Windows runner; the default limit is ten.
      - run: go test -race -short -timeout 25m ./...
      - name: Full simulator and scenarios
        if: runner.os == 'Linux'
        run: go test -count=1 ./internal/scenario/
      - name: Build ka
        run: go build ./cmd/ka
      # The UI bundle is committed (go install needs it); it must match web/.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 (v7.1.0)
        if: runner.os == 'Linux'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web UI is built from source and API types are current
        if: runner.os == 'Linux'
        working-directory: web
        run: |
          npm ci
          npm run gen:api
          npm run build
          git diff --exit-code -- . ../ui
          test -z "$(git status --porcelain -- . ../ui)" || (git status --porcelain -- . ../ui && exit 1)

  # The check action, run against a conformance store with ka built from
  # this checkout.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7 (v7.1.0)
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/bin/ka" ./cmd/ka && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: ./actions/check
        with:
          path: spec/v1/conformance/valid/minimal/store
          skip-install: "true"

  # install.sh against the published latest release, with dash (Debian's sh)
  # on Linux and the system sh on macOS.
  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - name: Install with the script
        run: |
          KA_VERSION=1.2.0 KA_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/ka" version
      # In a checkout that is not on a tag, the script builds it with Go.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7 (v7.1.0)
        with:
          go-version-file: go.mod
      - name: Build the checkout with the script
        run: |
          KA_INSTALL_DIR="$RUNNER_TEMP/src" sh install.sh
          "$RUNNER_TEMP/src/ka" version
          "$RUNNER_TEMP/src/ka" ui use . && "$RUNNER_TEMP/src/ka" ui status | grep -q "$PWD/ui"

  # install.ps1 under PowerShell 7 (pwsh) and Windows PowerShell 5.1
  # (powershell), which AGENTS.md tells users to run.
  install-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - name: Install a release with install.ps1
        shell: pwsh
        run: |
          $env:KA_VERSION = '1.2.0'
          $env:KA_INSTALL_DIR = "$env:RUNNER_TEMP\bin"
          ./install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\bin\ka.exe" version
      # Outside the checkout, so the script resolves the latest release itself.
      - name: Install the latest release with Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\script" | Out-Null
          Copy-Item install.ps1 "$env:RUNNER_TEMP\script\install.ps1"
          $env:KA_INSTALL_DIR = "$env:RUNNER_TEMP\bin51"
          & "$env:RUNNER_TEMP\script\install.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\bin51\ka.exe" version
      # In a checkout that is not on a tag (actions/checkout fetches no tags),
      # git describe fails on stderr and the script builds the checkout with Go.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7 (v7.1.0)
        with:
          go-version-file: go.mod
      - name: Build the checkout with Windows PowerShell 5.1
        shell: powershell
        run: |
          $env:KA_INSTALL_DIR = "$env:RUNNER_TEMP\src"
          ./install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\src\ka.exe" version
