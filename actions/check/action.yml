name: ka check
description: Validate KanArtist stores against the Store Spec, with annotations on the files and lines (or SARIF for code scanning).
branding:
  icon: check-square
  color: green
inputs:
  path:
    description: Store directories to check, space-separated (default: the repository root).
    default: "."
  version:
    description: The ka release to use, such as v1.0.0, or "latest".
    default: latest
  format:
    description: "github (annotations on the pull request) or sarif (writes sarif-file for github/codeql-action/upload-sarif)."
    default: github
  sarif-file:
    description: Where to write the SARIF report when format is sarif.
    default: ka-check.sarif
  args:
    description: Extra arguments for ka check, such as --map URL=DIR for config parents.
    default: ""
outputs:
  sarif-file:
    description: The SARIF report path (format sarif).
    value: ${{ steps.check.outputs.sarif-file }}
runs:
  using: composite
  steps:
    - name: Install ka
      shell: bash
      env:
        KA_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]'); [ "$os" = macos ] && os=darwin
        arch=$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]'); [ "$arch" = x64 ] && arch=amd64
        ext=tar.gz; [ "$os" = windows ] && ext=zip
        if [ "$KA_VERSION" = latest ]; then base=https://github.com/JumpKickOSS/ka/releases/latest/download
        else base=https://github.com/JumpKickOSS/ka/releases/download/$KA_VERSION; fi
        dir="$RUNNER_TEMP/ka-bin"; mkdir -p "$dir"
        if curl -fsSL "$base/ka_${os}_${arch}.$ext" -o "$RUNNER_TEMP/ka.$ext"; then
          if [ "$ext" = zip ]; then unzip -q -o "$RUNNER_TEMP/ka.$ext" -d "$dir"; else tar -xzf "$RUNNER_TEMP/ka.$ext" -C "$dir"; fi
        elif command -v go >/dev/null; then
          echo "No ka release asset for $os/$arch at $base; building it with go install."
          v=$KA_VERSION; [ "$v" = latest ] && v=main
          GOBIN="$dir" go install "github.com/JumpKickOSS/ka/cmd/ka@$v"
        else
          echo "::error::No ka release for $os/$arch, and Go is not installed to build it (add actions/setup-go before this step)."
          exit 1
        fi
        echo "$dir" >> "$GITHUB_PATH"
    - name: ka check
      id: check
      shell: bash
      env:
        KA_PATHS: ${{ inputs.path }}
        KA_FORMAT: ${{ inputs.format }}
        KA_SARIF: ${{ inputs.sarif-file }}
        KA_ARGS: ${{ inputs.args }}
      run: |
        set -uo pipefail
        ka version
        # shellcheck disable=SC2086
        if [ "$KA_FORMAT" = sarif ]; then
          ka check --ci --format sarif -o "$KA_SARIF" $KA_ARGS $KA_PATHS; code=$?
          echo "sarif-file=$KA_SARIF" >> "$GITHUB_OUTPUT"
        else
          ka check --ci $KA_ARGS $KA_PATHS; code=$?
        fi
        exit $code
