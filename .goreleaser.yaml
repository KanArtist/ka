# GoReleaser v2: binaries for six platforms, archives, checksums, SBOMs,
# keyless cosign signatures, a container image, deb/rpm, and Homebrew,
# Scoop and winget manifests. Run by .github/workflows/release.yml on a v* tag.
version: 2
project_name: ka

before:
  hooks:
    - go mod download

builds:
  - id: ka
    main: ./cmd/ka
    binary: ka
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: ka
    # No version in the name, so releases/latest/download/ka_linux_amd64.tar.gz
    # always works (the check action relies on it).
    name_template: "ka_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]

nfpms:
  - id: packages
    package_name: ka
    # No version in the name, so releases/latest/download/ka_linux_amd64.deb
    # (and .rpm) always works, like the archives.
    file_name_template: "ka_{{ .Os }}_{{ .Arch }}"
    vendor: KanArtist
    homepage: https://github.com/KanArtist/ka
    maintainer: Bryan Sant <BryanSant@users.noreply.github.com>
    description: KanArtist, a git-native work tracker for AI agents and the humans who watch them.
    license: Apache-2.0
    formats: [deb, rpm]
    dependencies:
      - git

dockers_v2:
  - id: ka
    dockerfile: Dockerfile.release
    images:
      - ghcr.io/kanartist/ka
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: https://github.com/KanArtist/ka
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: Apache-2.0

docker_signs:
  - cmd: cosign
    artifacts: images
    args: ["sign", "--yes", "${artifact}"]

# Package managers. Homebrew and Scoop push with a per-repository deploy key
# (TAP_SSH_KEY, SCOOP_SSH_KEY); winget opens a pull request with a token
# (WINGET_GITHUB_TOKEN). Each step is skipped when its secret is unset, and
# for prereleases. See docs/releasing.md.
homebrew_casks:
  - name: ka
    repository:
      owner: KanArtist
      name: homebrew-tap
      git:
        url: git@github.com:KanArtist/homebrew-tap.git
        private_key: "{{ .Env.TAP_SSH_KEY }}"
    skip_upload: '{{ if or .Prerelease (not (isEnvSet "TAP_SSH_KEY")) }}true{{ else }}false{{ end }}'
    directory: Casks
    homepage: https://github.com/KanArtist/ka
    description: Git-native work tracker for AI agents and the humans who watch them
    binaries: [ka]
    # The binary is not notarized; clear the quarantine flag so macOS runs it.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/ka"]
          end

scoops:
  - name: ka
    repository:
      owner: KanArtist
      name: scoop-bucket
      git:
        url: git@github.com:KanArtist/scoop-bucket.git
        private_key: "{{ .Env.SCOOP_SSH_KEY }}"
    skip_upload: '{{ if or .Prerelease (not (isEnvSet "SCOOP_SSH_KEY")) }}true{{ else }}false{{ end }}'
    homepage: https://github.com/KanArtist/ka
    description: Git-native work tracker for AI agents and the humans who watch them
    license: Apache-2.0
    depends: [git]

winget:
  - name: ka
    publisher: KanArtist
    short_description: Git-native work tracker for AI agents and the humans who watch them
    license: Apache-2.0
    homepage: https://github.com/KanArtist/ka
    package_identifier: KanArtist.ka
    repository:
      owner: KanArtist
      name: winget-pkgs
      branch: "ka-{{ .Version }}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    skip_upload: '{{ if or .Prerelease (not (isEnvSet "WINGET_GITHUB_TOKEN")) }}true{{ else }}false{{ end }}'

release:
  github:
    owner: KanArtist
    name: ka
  draft: false
  prerelease: auto

changelog:
  use: github
  sort: asc
